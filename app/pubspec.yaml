name: dance_trainer
description: Wearable dance trainer — phone app and big-screen step chart.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.33.0
  just_audio: ^0.9.40
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.69.0
  web_socket_channel: ^3.0.1
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - ../presets/
    - assets/
