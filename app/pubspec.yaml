name: dance_trainer
description: Wearable dance trainer — phone app and big-screen step chart.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.33.0
  just_audio: ^0.9.40
  # Audio focus: pause on a call or another app, never resume by itself.
  audio_session: ^0.1.25
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Fake Bluetooth platform in test/support/fake_ble_platform.dart.
  flutter_blue_plus_platform_interface: ^7.0.0
  # Fake audio and documents folder for the recorder and dance-screen tests.
  just_audio_platform_interface: ^4.6.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/presets/
    - assets/music/
